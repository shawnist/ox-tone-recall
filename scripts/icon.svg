<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    OX Tone Recall: the OX and LUNA, each handing to the other.
    A full square, edge to edge: no rounded outer corners and no margin.
    The OX is its logo's cabinet, on the orange and white of the OX app's opening screen.
    LUNA is its app icon, measured from the icon itself: a dark teal square with a pale green
    border, and its mark set to the right so the right stroke runs into the edge.
    The pale arrow is LUNA to the OX (Recall); the black one is the OX to LUNA (Save to track).
    Render to icon.png at 512 by 512.
  -->
  <rect width="512" height="512" fill="#f3f0ea"/>
  <rect width="512" height="256" fill="#e2572b"/>
  <path d="M 66 310 V 126 H 180" fill="none" stroke="#f7f5f0" stroke-width="28"/>
  <path d="M 220 126 L 178 162 L 178 90 Z" fill="#f7f5f0"/>
  <path d="M 404 212 V 386 H 272" fill="none" stroke="#1b1b1b" stroke-width="28"/>
  <path d="M 232 386 L 274 350 L 274 422 Z" fill="#1b1b1b"/>
  <rect x="236" y="40" width="236" height="172" rx="36" fill="#f7f5f0" stroke="#1b1b1b" stroke-width="24"/>
  <circle cx="300.3" cy="126" r="33" fill="none" stroke="#1b1b1b" stroke-width="21"/>
  <path d="M 372.6 82.5 L 439.5 169.5 M 439.5 82.5 L 372.6 169.5" fill="none" stroke="#1b1b1b" stroke-width="21.8"/>
  <clipPath id="luna">
  <rect x="28" y="288" width="196" height="196" rx="45.5"/>
  </clipPath>
  <clipPath id="luna-foot">
  <rect x="28" y="288" width="204" height="169.9"/>
  </clipPath>
  <g clip-path="url(#luna)">
  <rect x="28" y="288" width="196" height="196" fill="#0c3835"/>
  <g clip-path="url(#luna-foot)">
  <path d="M 92.5 484 L 165.2 329.4 L 232 471.5" fill="none" stroke="#99ccc7" stroke-width="14.9" stroke-linejoin="miter" stroke-miterlimit="10"/>
  </g>
  <rect x="32.8" y="292.8" width="186.4" height="186.4" rx="40.7" fill="none" stroke="#99ccc7" stroke-width="9.6"/>
  </g>
</svg>
